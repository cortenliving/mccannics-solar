name: Assemble index.html
on:
  workflow_dispatch:
  push:
    paths:
      - '_parts/**'
      - '.github/workflows/assemble-index.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate parts
        run: |
          cat _parts/chunk_0.txt _parts/chunk_1.txt _parts/chunk_2.txt _parts/chunk_3.txt _parts/chunk_4.txt _parts/chunk_5.txt > index.html
          wc -c index.html
          head -c 20 index.html; echo
          tail -c 20 index.html; echo
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -r _parts || true
          git commit -m "Add index.html" || echo "no changes"
          git push
